name: Football CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Syntax Check (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite, pdo_pgsql, mbstring, json, curl

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Check PHP Syntax (Lint)
        run: |
          find public src tests -type f -name "*.php" 2>/dev/null -exec php -l {} + || true
